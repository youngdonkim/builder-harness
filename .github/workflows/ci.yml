name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 앱 코드가 생기기 전(6단계 MvpBuild 이전)에는 검사할 것이 없어 통과 처리한다.
      # package-lock.json이 생기는 순간부터 아래 Node 단계들이 자동으로 돌기 시작한다.
      - name: Node 프로젝트 여부 확인
        id: node
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json 없음 — 앱 코드 생기기 전이라 빌드 검사를 건너뜀 (통과)"
          fi

      - if: steps.node.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.node.outputs.present == 'true'
        run: npm ci

      - if: steps.node.outputs.present == 'true'
        run: npm run lint

      # Supabase 환경 변수(NEXT_PUBLIC_SUPABASE_URL 등) 없이 확인 완료:
      # src/lib/supabase.ts는 함수 호출 시점에만 값을 읽고(값이 없으면 빈 문자열로 대체),
      # 어디서도 import되지 않아 빌드·프리렌더 중에 실행되지 않는다.
      # 그래서 자리표시자 env 없이도 npm run build가 그대로 통과한다.
      - if: steps.node.outputs.present == 'true'
        run: npm run build

      # 마이그레이션이 든 PR을 머지해도 클라우드 DB는 자동으로 안 바뀐다 —
      # `npx supabase db push --linked`를 사람이 따로 돌려야 반영된다.
      # 그래서 여기서는 밀린 게 있는지 확인만 하고, 있으면 CI를 실패시켜 알려준다.
      # 자동으로 밀지 않는 이유: 되돌릴 수 있는 위험만 자동화하기 때문이다. 코드 배포는
      # 잘못돼도 이전 버전을 다시 올리면 되지만, 지워진 데이터는 안 돌아온다.
      # drop이 든 마이그레이션이 사람 눈을 안 거치고 나가면 안 된다.
      # 아직 Supabase를 안 쓰는 프로젝트도 있으니, Secrets가 없으면 조용히 건너뛴다
      # (위 package-lock.json 확인과 같은 방식).
      - name: Supabase Secrets 여부 확인
        if: github.event_name == 'push' && steps.node.outputs.present == 'true'
        id: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Supabase Secrets 없음 — 밀린 마이그레이션 확인을 건너뜀 (통과)"
          fi

      # PR에서는 돌리지 않는다 — 머지되기 전이라 "아직 안 밀렸다"가 당연한 상태다.
      # timeout을 두는 이유: `supabase link`가 DB 비밀번호를 물어보며 입력을 기다리는 경우가
      # 있는데, CI에는 답할 사람이 없어 그대로 멈춘다. 5분이면 끊고 실패로 알린다.
      - name: 밀린 마이그레이션 확인 (감지만, 자동으로 밀지 않음)
        timeout-minutes: 5
        if: github.event_name == 'push' && steps.supabase.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase migration list --linked > migration-list.txt
          cat migration-list.txt
          # 표에서 Local 칸엔 번호가 있는데 Remote 칸이 비어 있으면 아직 안 올라간 마이그레이션이다.
          # 표 구분선이 │(여러 바이트짜리 문자)라 awk가 못 쪼갠다 — sed로 |로 바꿔 놓고 센다.
          if sed 's/│/|/g' migration-list.txt | awk -F'|' '
                NF >= 3 {
                  i = 1
                  if (NF >= 4 && $1 ~ /^[[:space:]]*$/) i = 2   # 줄이 구분자로 시작하면 한 칸 밀어서 본다
                  l = $i; r = $(i + 1)
                  gsub(/[^0-9]/, "", l); gsub(/[^0-9]/, "", r)
                  if (l != "" && r == "") found = 1
                }
                END { exit found ? 0 : 1 }
              '; then
            echo "::error::클라우드에 아직 안 올라간 마이그레이션이 있다. 로컬에서 'npx supabase db push --linked'를 직접 돌려라 (CI는 자동으로 밀지 않는다)."
            exit 1
          fi
